<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple 3D Shooter</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: "Roboto", system-ui, sans-serif;
      background: #0b0f1f;
      color: #f5f7ff;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 18px;
      background: rgba(10, 15, 32, 0.6);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }

    #hud span {
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      z-index: 9;
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: #f5f7ff;
      border-radius: 2px;
    }

    #crosshair::before {
      width: 2px;
      height: 18px;
      left: 8px;
      top: 0;
    }

    #crosshair::after {
      width: 18px;
      height: 2px;
      left: 0;
      top: 8px;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, rgba(19, 32, 66, 0.9), rgba(3, 5, 12, 0.9));
      z-index: 20;
      text-align: center;
      padding: 24px;
    }

    #overlay.hidden {
      display: none;
    }

    .panel {
      max-width: 420px;
      background: rgba(15, 20, 40, 0.8);
      border-radius: 18px;
      padding: 28px 32px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .panel h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .panel p {
      margin: 12px 0;
      line-height: 1.5;
      color: #d5d9ff;
    }

    .panel button {
      margin-top: 18px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #4c7dff;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .panel button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(76, 125, 255, 0.35);
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 40, 0.85);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      letter-spacing: 0.02em;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 15;
    }

    #toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <span id="score">Score: 0</span>
    <span id="health">Shield: 100%</span>
    <span id="wave">Welle: 1</span>
  </div>
  <div id="crosshair"></div>
  <div id="overlay">
    <div class="panel">
      <h1>Simple 3D Shooter</h1>
      <p>Bewege dich mit <strong>WASD</strong>, schaue mit der Maus und schieße mit <strong>Klick</strong>.</p>
      <p>Überlebe so viele Wellen wie möglich. Gegner zerstören deine Schilde, wenn sie dich berühren.</p>
      <button id="startButton">Start</button>
    </div>
  </div>
  <div id="toast">Neue Welle!</div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { PointerLockControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js";

    const container = document.getElementById("game");
    const overlay = document.getElementById("overlay");
    const startButton = document.getElementById("startButton");
    const scoreDisplay = document.getElementById("score");
    const healthDisplay = document.getElementById("health");
    const waveDisplay = document.getElementById("wave");
    const toast = document.getElementById("toast");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#0b0f1f");
    scene.fog = new THREE.Fog("#0b0f1f", 10, 60);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 2, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new PointerLockControls(camera, renderer.domElement);

    const ambientLight = new THREE.AmbientLight("#9fb3ff", 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight("#ffffff", 1.1);
    directionalLight.position.set(5, 10, 7);
    scene.add(directionalLight);

    const floorGeometry = new THREE.PlaneGeometry(200, 200, 10, 10);
    const floorMaterial = new THREE.MeshStandardMaterial({ color: "#1b244a", roughness: 0.8, metalness: 0.2 });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    scene.add(floor);

    const grid = new THREE.GridHelper(200, 40, "#3a4a8b", "#1c254c");
    grid.position.y = 0.01;
    scene.add(grid);

    const player = {
      velocity: new THREE.Vector3(),
      direction: new THREE.Vector3(),
      speed: 10,
      health: 100,
      score: 0,
      wave: 1,
    };

    const enemyMaterial = new THREE.MeshStandardMaterial({ color: "#ff5c5c", emissive: "#6f1a1a", emissiveIntensity: 0.5 });
    const enemyGeometry = new THREE.SphereGeometry(0.6, 18, 18);
    const enemies = [];

    const keys = {
      forward: false,
      backward: false,
      left: false,
      right: false,
    };

    const raycaster = new THREE.Raycaster();
    const clock = new THREE.Clock();

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function spawnEnemy(radius = 20) {
      const enemy = new THREE.Mesh(enemyGeometry, enemyMaterial.clone());
      const angle = Math.random() * Math.PI * 2;
      const distance = radius + Math.random() * 15;
      enemy.position.set(
        Math.cos(angle) * distance,
        0.6,
        Math.sin(angle) * distance
      );
      enemy.userData.speed = 1.2 + Math.random();
      scene.add(enemy);
      enemies.push(enemy);
    }

    function spawnWave() {
      const count = 6 + player.wave * 2;
      for (let i = 0; i < count; i += 1) {
        spawnEnemy(18 + player.wave * 2);
      }
      showToast(`Welle ${player.wave}`);
    }

    function resetGame() {
      player.health = 100;
      player.score = 0;
      player.wave = 1;
      enemies.splice(0).forEach((enemy) => scene.remove(enemy));
      camera.position.set(0, 2, 6);
      spawnWave();
      updateHud();
    }

    function updateHud() {
      scoreDisplay.textContent = `Score: ${player.score}`;
      healthDisplay.textContent = `Shield: ${Math.max(0, Math.floor(player.health))}%`;
      waveDisplay.textContent = `Welle: ${player.wave}`;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function shoot() {
      if (!controls.isLocked) {
        return;
      }
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const hits = raycaster.intersectObjects(enemies, false);
      if (hits.length > 0) {
        const target = hits[0].object;
        target.userData.hitFlash = 0.12;
        player.score += 10;
        scene.remove(target);
        enemies.splice(enemies.indexOf(target), 1);
        if (enemies.length === 0) {
          player.wave += 1;
          spawnWave();
        } else {
          spawnEnemy(22 + player.wave * 2);
        }
        updateHud();
      }
    }

    function updateEnemies(delta) {
      enemies.forEach((enemy) => {
        const direction = new THREE.Vector3().subVectors(camera.position, enemy.position);
        direction.y = 0;
        direction.normalize();
        enemy.position.addScaledVector(direction, enemy.userData.speed * delta);

        if (enemy.userData.hitFlash) {
          enemy.userData.hitFlash -= delta;
          enemy.material.emissiveIntensity = 1.4;
        } else {
          enemy.material.emissiveIntensity = 0.5;
        }

        const distance = enemy.position.distanceTo(camera.position);
        if (distance < 1.5) {
          player.health -= 18 * delta;
        }
      });
    }

    function updateMovement(delta) {
      player.velocity.set(0, 0, 0);

      player.direction.set(
        Number(keys.right) - Number(keys.left),
        0,
        Number(keys.backward) - Number(keys.forward)
      );

      if (player.direction.lengthSq() > 0) {
        player.direction.normalize();
        const moveX = player.direction.x * player.speed * delta;
        const moveZ = player.direction.z * player.speed * delta;
        controls.moveRight(moveX);
        controls.moveForward(moveZ);
      }
    }

    function animate() {
      const delta = Math.min(clock.getDelta(), 0.05);
      if (controls.isLocked) {
        updateMovement(delta);
        updateEnemies(delta);
        updateHud();

        if (player.health <= 0) {
          controls.unlock();
          overlay.classList.remove("hidden");
          overlay.querySelector("h1").textContent = "Game Over";
          overlay.querySelector("p").innerHTML = "Deine Schilde sind leer. Klicke auf Start, um es erneut zu versuchen.";
          return;
        }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    startButton.addEventListener("click", () => {
      resetGame();
      controls.lock();
    });

    controls.addEventListener("lock", () => {
      overlay.classList.add("hidden");
    });

    controls.addEventListener("unlock", () => {
      overlay.classList.remove("hidden");
    });

    window.addEventListener("resize", onWindowResize);
    window.addEventListener("keydown", (event) => {
      switch (event.code) {
        case "KeyW":
          keys.forward = true;
          break;
        case "KeyS":
          keys.backward = true;
          break;
        case "KeyA":
          keys.left = true;
          break;
        case "KeyD":
          keys.right = true;
          break;
        default:
          break;
      }
    });

    window.addEventListener("keyup", (event) => {
      switch (event.code) {
        case "KeyW":
          keys.forward = false;
          break;
        case "KeyS":
          keys.backward = false;
          break;
        case "KeyA":
          keys.left = false;
          break;
        case "KeyD":
          keys.right = false;
          break;
        default:
          break;
      }
    });

    window.addEventListener("click", shoot);

    resetGame();
    animate();
  </script>
</body>
</html>
